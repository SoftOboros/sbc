name: SBC verification matrix

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-14]
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Enable native Windows link fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          New-Item -Path $key -Force -ErrorAction Stop | Out-Null
          New-ItemProperty -LiteralPath $key -Name AllowDevelopmentWithoutDevLicense -PropertyType DWord -Value 1 -Force -ErrorAction Stop | Out-Null
      - name: Install developer-only schema tools
        run: |
          python -m pip --isolated install --only-binary=:all: --index-url https://pypi.org/simple jsonschema==4.26.0 referencing==0.37.0 attrs==26.1.0 rpds-py==2026.6.3 jsonschema-specifications==2025.9.1
      - name: Verify source and installed distribution
        run: python tools/tools/ci_verify.py --work-dir "${{ runner.temp }}/sbct-verify"
      - name: Retain matrix evidence and tested wheel
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbct-${{ matrix.os }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/sbct-verify/evidence/
          if-no-files-found: error
          retention-days: 30
