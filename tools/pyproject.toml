[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "softoboros-sbc"
dynamic = ["version"]
description = "Portable Spec Before Code supporting tools"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.urls]
Repository = "https://github.com/SoftOboros/sbc"
Documentation = "https://github.com/SoftOboros/sbc/tree/main/docs/sbc-tools"

[project.scripts]
sbc-tools = "sbc_tools.cli:main"

[tool.setuptools.dynamic]
version = {attr = "sbc_tools.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
