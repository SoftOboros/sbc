[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sbc-tools"
dynamic = ["version"]
description = "Portable Spec Before Code supporting tools"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
sbc-tools = "sbc_tools.cli:main"

[tool.setuptools.dynamic]
version = {attr = "sbc_tools.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
